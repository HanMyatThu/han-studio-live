# Production: docker compose up -d --build
# Local dev database only: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zat}
      POSTGRES_DB: zat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zat"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_IMA_AD_TAG_URL: ${NEXT_PUBLIC_IMA_AD_TAG_URL:-}
    restart: unless-stopped
    profiles: ["prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zat:${POSTGRES_PASSWORD:-zat}@db:5432/zat
    ports:
      # Only reachable from the server itself. Lets an existing nginx/Caddy proxy to Zat.
      - "127.0.0.1:${APP_PORT:-3010}:3000"
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  storage:
  caddy_data:
